  </defs>
  <rect width="1440" height="720" fill="url(#bg)"/>
  <rect width="1440" height="720" fill="url(#grid)"/>
  
  <g>
    <rect x="780" y="440" width="110" height="180" rx="8" fill="#b45309" fill-opacity=".55"/>
    <rect x="915" y="360" width="110" height="260" rx="8" fill="#94a3b8" fill-opacity=".55"/>
    <rect x="1050" y="270" width="110" height="350" rx="8" fill="#eab308" fill-opacity=".55"/>
  </g>
  <path d="M780 430 L1160 260" stroke="#ffffff" stroke-opacity=".35" stroke-width="3"
